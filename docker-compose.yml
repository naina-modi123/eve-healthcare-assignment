services:
  db:
    image: postgres:17
    container_name: eve-healthcare-db
    environment:
      POSTGRES_DB: eve_healthcare
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .
    container_name: eve-healthcare-api
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/eve_healthcare
      JWT_SECRET_KEY: change_this_in_production
      JWT_ALGORITHM: HS256
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data: